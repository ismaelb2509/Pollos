<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-label="Pollo entero asado a la leña">
  <defs>
    <linearGradient id="piel" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFE6B8"/>
      <stop offset=".2" stop-color="#F9B863"/>
      <stop offset=".52" stop-color="#DE7C24"/>
      <stop offset=".8" stop-color="#AF4B10"/>
      <stop offset="1" stop-color="#742D07"/>
    </linearGradient>
    <linearGradient id="pata" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#F6B25B"/>
      <stop offset=".55" stop-color="#C4611A"/>
      <stop offset="1" stop-color="#803206"/>
    </linearGradient>
    <linearGradient id="hueso" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#FFF8EA"/>
      <stop offset="1" stop-color="#D9BF97"/>
    </linearGradient>
    <radialGradient id="brasa" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2B23"/>
      <stop offset="1" stop-color="#171010"/>
    </linearGradient>
    <style>
      @keyframes vapor{0%{opacity:0;transform:translateY(8px)}35%{opacity:.5}100%{opacity:0;transform:translateY(-20px)}}
      .vapor path{animation:vapor 5.5s ease-in-out infinite}
      .vapor path:nth-child(2){animation-delay:1.8s}
      .vapor path:nth-child(3){animation-delay:3.4s}
      @media (prefers-reduced-motion:reduce){.vapor path{animation:none;opacity:.32}}
    </style>
  </defs>

  <circle cx="260" cy="266" r="238" fill="url(#brasa)"/>

  <g class="vapor" fill="none" stroke="#FFE9CC" stroke-width="7" stroke-linecap="round" opacity=".45">
    <path d="M206 106c17-19-15-30 2-53"/>
    <path d="M260 92c18-21-16-34 2-57"/>
    <path d="M314 108c17-19-15-30 2-53"/>
  </g>

  <!-- plato -->
  <ellipse cx="260" cy="408" rx="206" ry="49" fill="url(#plato)"/>
  <ellipse cx="260" cy="402" rx="206" ry="49" fill="none" stroke="#5C4234" stroke-width="3" opacity=".85"/>
  <ellipse cx="260" cy="402" rx="160" ry="33" fill="none" stroke="#3E2B22" stroke-width="2"/>

  <!-- romero -->
  <g stroke="#5FA463" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M92 392c22-8 44-10 62-4"/>
    <path d="M104 384l6 12M120 380l5 13M136 379l4 13M152 382l3 12"/>
    <path d="M428 392c-22-8-44-10-62-4"/>
    <path d="M416 384l-6 12M400 380l-5 13M384 379l-4 13M368 382l-3 12"/>
  </g>

  <!-- muslos -->
  <path d="M198 348c-24 24-56 44-70 62-12 15-4 32 12 28 26-7 62-42 80-70z" fill="url(#pata)"/>
  <path d="M322 348c24 24 56 44 70 62 12 15 4 32-12 28-26-7-62-42-80-70z" fill="url(#pata)"/>
  <circle cx="128" cy="430" r="16" fill="url(#hueso)"/>
  <circle cx="145" cy="444" r="13" fill="url(#hueso)"/>
  <circle cx="392" cy="430" r="16" fill="url(#hueso)"/>
  <circle cx="375" cy="444" r="13" fill="url(#hueso)"/>

  <!-- cuerpo -->
  <path d="M260 112c44 0 74 34 84 82 8 38 32 64 32 104 0 52-48 90-116 90s-116-38-116-90c0-40 24-66 32-104 10-48 40-82 84-82z" fill="url(#piel)"/>

  <!-- alas -->
  <path d="M186 216c-22 42-16 100 24 138-32-14-62-50-64-92-1-28 16-44 40-46z" fill="#7E3208" opacity=".26"/>
  <path d="M334 216c22 42 16 100-24 138 32-14 62-50 64-92 1-28-16-44-40-46z" fill="#7E3208" opacity=".17"/>

  <!-- pliegue de la pechuga -->
  <path d="M260 126c-11 78-11 190 0 250" fill="none" stroke="#7E3208" stroke-width="8" stroke-linecap="round" opacity=".22"/>

  <!-- brillos -->
  <ellipse cx="222" cy="204" rx="60" ry="34" fill="#FFF3DA" opacity=".24" transform="rotate(-26 222 204)"/>
  <ellipse cx="206" cy="188" rx="26" ry="13" fill="#FFFAEF" opacity=".3" transform="rotate(-26 206 188)"/>
  <path d="M172 268c-8 44 8 86 42 108" fill="none" stroke="#FFE1B0" stroke-width="6" stroke-linecap="round" opacity=".18"/>

  <!-- vetas del asado -->
  <g fill="#6E2A06" opacity=".14">
    <ellipse cx="300" cy="222" rx="34" ry="10" transform="rotate(28 300 222)"/>
    <ellipse cx="322" cy="292" rx="40" ry="11" transform="rotate(72 322 292)"/>
    <ellipse cx="226" cy="330" rx="30" ry="9" transform="rotate(-16 226 330)"/>
    <ellipse cx="296" cy="352" rx="26" ry="8" transform="rotate(12 296 352)"/>
  </g>
  <g fill="#FFDFA8" opacity=".16">
    <ellipse cx="288" cy="180" rx="26" ry="9" transform="rotate(18 288 180)"/>
    <ellipse cx="246" cy="268" rx="20" ry="8" transform="rotate(-8 246 268)"/>
  </g>

  <!-- chispas -->
  <g fill="#FFC53D">
    <circle cx="86" cy="196" r="4" opacity=".7"/>
    <circle cx="444" cy="230" r="5" opacity=".55"/>
    <circle cx="408" cy="136" r="3" opacity=".75"/>
    <circle cx="100" cy="300" r="3" opacity=".5"/>
    <circle cx="456" cy="332" r="4" opacity=".4"/>
  </g>
</svg>
